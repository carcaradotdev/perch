[versions]
agp = "9.2.1"
android-compileSdk = "36"
android-minSdk = "21"
# The sample app draws Compose UI and pulls three navigation libraries, whose floors sit above the
# library's at both ends: Compose asks to be compiled against 37, and the navigation libraries do
# not ship for API 21. Perch itself still builds against 36 and installs on 21 - these two are the
# sample's numbers, not Perch's.
android-sampleCompileSdk = "36"
android-sampleTargetSdk = "36"
android-sampleMinSdk = "24"
androidxActivity = "1.13.0"
binaryCompatibilityValidator = "0.18.1"
composeBom = "2026.06.01"
composeDestinations = "2.3.0"
detekt = "1.23.8"
junit = "4.13.2"
kctfork = "0.13.0"
kotlin = "2.4.10"
kotlinx-serialization = "1.11.0"
ksp = "2.3.10"
ktor = "3.5.1"
mavenPublish = "0.37.0"
navigation3 = "1.1.7"
voyager = "1.1.0-beta03"

[libraries]
ktor-resources = { module = "io.ktor:ktor-resources", version.ref = "ktor" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kctfork-core = { module = "dev.zacsweers.kctfork:core", version.ref = "kctfork" }
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }
junit = { module = "junit:junit", version.ref = "junit" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
mavenPublish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
binaryCompatibilityValidator-gradlePlugin = { module = "org.jetbrains.kotlinx:binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }

# Everything below here is used by the sample app only. Perch itself depends on
# kotlinx-serialization-core and nothing else.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
composeDestinations-core = { module = "io.github.raamcosta.compose-destinations:core", version.ref = "composeDestinations" }
composeDestinations-ksp = { module = "io.github.raamcosta.compose-destinations:ksp", version.ref = "composeDestinations" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
