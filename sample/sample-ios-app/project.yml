# `xcodegen generate` in this directory produces SampleIos.xcodeproj from this file, which is the
# reviewable artefact; the pbxproj is not committed.
name: SampleIos
options:
  bundleIdPrefix: com.example.sample
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  SampleIos:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleURLTypes:
          # The custom scheme only, and no line here could add the https one: an https link reaches
          # an iOS app through Universal Links, needing an apple-app-site-association file on a
          # domain this sample does not own. Sent to the OS, https://sample.example/... opens
          # Safari. The picker still parses it, host check included - what differs is who hands the
          # app the string.
          - CFBundleURLName: com.example.sample
            CFBundleURLSchemes: [sample]
    settings:
      base:
        # Static, so there is no embed-and-sign phase.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../sample-app/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS: -framework SampleShared
    preBuildScripts:
      - name: Link the Kotlin framework
        script: |
          cd "$SRCROOT/../.." && ./gradlew :sample:sample-app:linkDebugFrameworkIosSimulatorArm64
        basedOnDependencyAnalysis: false
