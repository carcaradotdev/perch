# The Xcode project is generated from this file rather than committed as a pbxproj: a pbxproj is
# thousands of lines of machine-written plist that nobody reviews and every Xcode version rewrites.
# `xcodegen generate` in this directory produces SampleIos.xcodeproj from what is below.
name: SampleIos
options:
  bundleIdPrefix: com.example.sample
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  SampleIos:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleURLTypes:
          # What makes this a deep-link demo rather than a URL-parsing demo: the scheme is
          # registered with the OS, so `xcrun simctl openurl` and a tap in Safari both arrive here.
          - CFBundleURLName: com.example.sample
            CFBundleURLSchemes: [sample]
    settings:
      base:
        # The framework is static, so linking is the whole story - there is no embed-and-sign phase
        # and nothing to copy into the bundle.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../sample-ios/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS: -framework SampleShared
    preBuildScripts:
      - name: Link the Kotlin framework
        script: |
          cd "$SRCROOT/../.." && ./gradlew :sample:sample-ios:linkDebugFrameworkIosSimulatorArm64
        basedOnDependencyAnalysis: false
