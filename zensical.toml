# The documentation site. `zensical serve` previews it, `zensical build` writes it to `site/`.
# See docs/contributing.md.

[project]
site_name = "Perch"
site_description = "Type-safe deep links for Kotlin Multiplatform"
site_url = "https://carcaradotdev.github.io/perch/"
copyright = "Copyright &copy; 2026 Carcara"

repo_url = "https://github.com/carcaradotdev/perch"
repo_name = "carcaradotdev/perch"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Guides" = [
    { "Declare routes" = "guides/routes.md" },
    { "Parse and build URLs" = "guides/urls.md" },
    { "Schemes and hosts" = "guides/schemes-and-hosts.md" },
    { "Multi-module apps" = "guides/multi-module.md" },
    { "Navigation and DI" = "guides/navigation.md" },
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Sample app" = "sample.md" },
  { "Contribute" = "contributing.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/bird"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
