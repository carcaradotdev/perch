name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow on the tagged commit, so a release runs the same checks under
  # the same names rather than a copy of them that drifts.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plugins:
    # The two builds that hold no Kotlin Multiplatform code: `build-logic` (the convention plugins
    # both other builds apply) and `perch-gradle-plugin` (the producer and aggregation plugins).
    # Neither has an Apple target, so neither needs a Mac.
    #
    # They are separate Gradle builds, not subprojects, so `./gradlew build` at the root never
    # reaches them. That is also why this job exists at all rather than being a step of the one
    # below: nothing in the root build's task graph can fail when a plugin's test does.
    name: plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the convention plugins
        run: ./gradlew -p build-logic build

      # `--no-configuration-cache` because the functional tests run real Gradle builds through
      # GradleTestKit, which serialises a `Project` the cache rejects. Unrelated to the root
      # build's Isolated Projects setting: this invocation makes `perch-gradle-plugin` the root, so
      # it never reads the properties that enable it.
      - name: Build and test the Gradle plugins
        run: ./gradlew -p perch-gradle-plugin build --no-configuration-cache

      # A rehearsal of half the release. It costs a minute and it is the only thing that proves the
      # POM, the sources jar and the javadoc jar Maven Central insists on are all still produced -
      # a break there is otherwise invisible until a release is already running.
      - name: Check the plugin artifacts still assemble
        run: ./gradlew -p perch-gradle-plugin publishToMavenLocal --no-configuration-cache

  library:
    # macOS, because `perch-core` targets iOS and macOS and no other host can compile them.
    #
    # One `build` rather than a job per target: Perch has six targets and one small library on
    # each of them, where splitting buys a clearer failure name only once a matrix is long enough
    # that a host is no longer the answer.
    name: library
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # `build` runs `check`, which is `apiCheck` for `perch-core` plus detekt over every
      # main source set. It also builds and tests `sample/`, which exercises the KSP processor and
      # the aggregation plugin end to end against the plugins resolved from `perch-gradle-plugin`
      # through `pluginManagement.includeBuild` - so a change to either plugin that breaks the
      # pipeline fails here even though the plugin build's own tests passed above.
      - name: Build, lint and test every target
        run: ./gradlew build

      - name: Check the library artifacts still assemble
        run: ./gradlew publishToMavenLocal
