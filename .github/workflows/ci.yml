name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The Apple targets (perch-core, perch-metro, perch-ksp's own consumers, the sample) only
    # build on a macOS runner; there is no Linux fallback.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Isolated Projects and the configuration cache are both on by default via
      # gradle.properties, so this inherits them without a flag. `build` depends on `check`,
      # which is where the real verification lives for this build:
      #   - apiCheck (all four published modules) fails if an API dump is stale.
      #   - the per-source-set Detekt tasks (detektMetadataCommonMain, detektJvmMain, ...) lint
      #     every module's main source sets; test sources are not linted. The plain `detekt`
      #     lifecycle task Gradle also registers is NO-SOURCE on
      #     a Kotlin Multiplatform module and would silently check nothing if invoked on its own
      #     - confirmed locally with `./gradlew :perch-core:detekt` - so it is deliberately not
      #     invoked here; `settings.gradle.kts` already fails the build if a module opts out of
      #     the convention plugin that wires the real tasks into `check`.
      #   - the sample (`:sample:sample-routes`, `:sample:sample-app`) builds and its tests run,
      #     proving the KSP-and-aggregation pipeline still works end to end.
      - name: Build and verify the library
        run: ./gradlew build

      # perch-gradle-plugin is a separate Gradle build (`pluginManagement.includeBuild`), so its
      # tasks are not reachable from the root task graph above and must be invoked with -p.
      # `build` here runs `test` (the plugin's own GradleRunner/TestKit suite) and
      # `validatePlugins` (parameter annotation checks), since both are wired into `check`.
      # `--no-configuration-cache`: required for this build's GradleRunner/TestKit-based tests,
      # for reasons unrelated to Perch itself.
      - name: Build and test the Gradle plugin build
        run: ./gradlew -p perch-gradle-plugin build --no-configuration-cache

      # build-logic is the third Gradle build, included by the root build's
      # `pluginManagement.includeBuild` and by that build alone. It holds the precompiled
      # convention plugins (dev.carcara.perch.detekt, dev.carcara.perch.publishing) that the root
      # build's modules apply; perch-gradle-plugin applies neither and includes nothing.
      # It has no unit tests of its own (`test` is NO-SOURCE), but `build` still compiles the
      # convention plugin scripts and runs `validatePlugins` against them, so a broken convention
      # plugin fails here instead of surfacing as a confusing failure in whichever module applies
      # it next.
      - name: Build the build-logic convention plugins
        run: ./gradlew -p build-logic build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/detekt/**
            **/build/test-results/**
