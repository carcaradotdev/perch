name: Docs

# Builds the documentation site on every pull request, so a broken link fails the pull request. On
# main it also publishes the site to GitHub Pages. That needs Settings > Pages > Source set to
# "GitHub Actions" once, in the repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Pinned, because Zensical is below 1.0 and a minor release can change the output.
      - name: Install Zensical
        run: pip install zensical==0.1.0

      # `--strict` turns a warning, such as a link to a page that does not exist, into a failure.
      - name: Build the site
        run: zensical build --clean --strict

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
