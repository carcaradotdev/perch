org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
# Gradle 9.6.1 still gates this behind the incubating `unsafe` name; the plain
# `org.gradle.isolated-projects` name the current userguide documents only starts doing anything
# from Gradle 9.7.0 onward. To reproduce the violation-diagnostics run that verified this build is
# clean:
#   ./gradlew check -Dorg.gradle.unsafe.isolated-projects=true \
#     -Dorg.gradle.internal.isolated-projects.diagnostics=true --no-build-cache
org.gradle.unsafe.isolated-projects=true
